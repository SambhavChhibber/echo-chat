# Render Blueprint: backend API (Docker). Frontend goes on Vercel (see README).
services:
  - type: web
    name: echo-chat-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: PROVIDER_ORDER
        value: gemini,groq
      - key: CORS_ORIGINS
        sync: false   # e.g. https://echo-chat.vercel.app
      - key: DATABASE_PATH
        value: /app/data/chat.db
      - key: CACHE_DIR
        value: /app/data/llm_cache
